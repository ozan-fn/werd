name: Release (new version)

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump (from latest release tag)
        required: true
        default: patch
        type: choice
        options:
          - major
          - minor
          - patch

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Cache Wails CLI
        id: cache-wails
        uses: actions/cache@v4
        with:
          path: ~/go/bin
          key: wails-cli-v2.15.0

      - name: Install Wails CLI
        if: steps.cache-wails.outputs.cache-hit != 'true'
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0

      - name: Add Wails CLI to PATH
        run: echo "$HOME/go/bin" >> "$GITHUB_PATH"

      - name: Cache node_modules
        id: cache-nm
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: frontend-node-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install frontend deps
        if: steps.cache-nm.outputs.cache-hit != 'true'
        working-directory: frontend
        run: npm ci

      - name: Install UPX (for wails -upx)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y upx

      - name: Build Wails app (windows/amd64)
        run: wails build -platform windows/amd64 -clean -upx

      - name: Cache downloaded packages
        id: cache-pkg
        uses: actions/cache@v4
        with:
          path: download
          key: werd-packages-v3

      - name: Download packages
        if: steps.cache-pkg.outputs.cache-hit != 'true'
        run: |
          mkdir -p download
          curl -fLo download/httpd.zip "https://www.apachelounge.com/download/VS17/binaries/httpd-2.4.66-251206-Win64-VS17.zip"
          curl -fLo download/php.zip "https://downloads.php.net/~windows/releases/php-8.4.24-Win32-vs17-x64.zip"
          curl -fLo download/pma.zip "https://files.phpmyadmin.net/phpMyAdmin/5.2.3/phpMyAdmin-5.2.3-english.zip"
          curl -fLo download/mysql.zip "https://cdn.mysql.com//Downloads/MySQL-8.4/mysql-8.4.11-winx64.zip"
          curl -fLo download/mkcert.exe "https://github.com/FiloSottile/mkcert/releases/download/v1.4.4/mkcert-v1.4.4-windows-amd64.exe"
          curl -fLo download/composer.phar "https://getcomposer.org/download/2.10.2/composer.phar"

      - name: Compute next version
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PREV=$(gh release list --limit 1 --json tagName -q '.[0].tagName' 2>/dev/null || echo "v0.0.0")
          PREV=${PREV:-v0.0.0}
          V=${PREV#v}
          IFS=. read -r MA MI PA <<< "$V"
          MA=${MA:-0}; MI=${MI:-0}; PA=${PA:-0}
          case "${{ github.event.inputs.bump }}" in
            major) MA=$((MA+1)); MI=0; PA=0 ;;
            minor) MI=$((MI+1)); PA=0 ;;
            patch) PA=$((PA+1)) ;;
          esac
          echo "tag=v${MA}.${MI}.${PA}" >> "$GITHUB_OUTPUT"
          echo "prev=${PREV}" >> "$GITHUB_OUTPUT"

      - name: Assemble staging
        shell: bash
        run: |
          set -eux
          STAGE="$GITHUB_WORKSPACE/stage"
          W="$STAGE/werd-${{ steps.ver.outputs.tag }}"
          mkdir -p "$W/bin" "$W/var/logs" "$W/var/tools"

          cp download/mkcert.exe "$W/var/tools/mkcert.exe"

          mkdir -p "$W/bin/composer-2.10.2"
          cp download/composer.phar "$W/bin/composer-2.10.2/composer.phar"
          sed 's/^          //' > "$W/bin/composer-2.10.2/composer.bat" <<'EOF'
          @ECHO OFF
          setlocal
          SET DP0=%~dp0
          IF EXIST "%DP0%\..\php-8.4.24-Win32-vs17-x64\php.exe" (
            SET "PHP_EXE=%DP0%\..\php-8.4.24-Win32-vs17-x64\php.exe"
          ) ELSE (
            SET "PHP_EXE=php"
          )
          "%PHP_EXE%" "%DP0%\composer.phar" %*
          endlocal
          EOF

          unzip -q download/httpd.zip -d "$W/bin"
          unzip -q download/php.zip   -d "$W/bin/php-extract"
          unzip -q download/pma.zip   -d "$W/bin"
          unzip -q download/mysql.zip -d "$W/bin"

          if [ -d "$W/bin/Apache24" ]; then
            mkdir -p "$W/bin/httpd-2.4.66-251206-Win64-VS17"
            mv "$W/bin/Apache24" "$W/bin/httpd-2.4.66-251206-Win64-VS17/Apache24"
          fi

          mv "$W/bin/php-extract" "$W/bin/php-8.4.24-Win32-vs17-x64"

          cp -r config "$W/config"
          cp build/bin/werd.exe "$W/werd.exe"
          cp README.md "$W/"
          touch "$W/var/logs/.gitkeep"

      - name: Zip release
        shell: bash
        run: |
          cd stage
          W="werd-${{ steps.ver.outputs.tag }}"
          zip -q -1 -r "$GITHUB_WORKSPACE/werd-windows-x64.zip" "$W"
          rm -rf "$W/bin/mysql-8.4.11-winx64"
          zip -q -1 -r "$GITHUB_WORKSPACE/werd-windows-x64-nomysql.zip" "$W"

      - name: Create release + upload
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.tag }}
          body: |
            Built from previous release `${{ steps.ver.outputs.prev }}`.

            > Extract so that `bin` lands at `E:\werd\bin`.
          files: |
            werd-windows-x64.zip
            werd-windows-x64-nomysql.zip
            build/bin/werd.exe
          generate_release_notes: true
