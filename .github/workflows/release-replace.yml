name: Release (replace existing)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Cache Wails CLI
        id: cache-wails
        uses: actions/cache@v4
        with:
          path: ~/go/bin
          key: wails-cli-v2.15.0

      - name: Install Wails CLI
        if: steps.cache-wails.outputs.cache-hit != 'true'
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0

      - name: Add Wails CLI to PATH
        run: echo "$HOME/go/bin" >> "$GITHUB_PATH"

      - name: Cache node_modules
        id: cache-nm
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: frontend-node-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install frontend deps
        if: steps.cache-nm.outputs.cache-hit != 'true'
        working-directory: frontend
        run: npm ci

      - name: Install UPX (for wails -upx)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y upx

      - name: Build Wails app (windows/amd64)
        run: wails build -platform windows/amd64 -clean -upx

      - name: Cache downloaded packages
        id: cache-pkg
        uses: actions/cache@v4
        with:
          path: download
          key: werd-packages-v3

      - name: Download packages
        if: steps.cache-pkg.outputs.cache-hit != 'true'
        run: |
          mkdir -p download
          curl -fLo download/httpd.zip "https://www.apachelounge.com/download/VS17/binaries/httpd-2.4.66-251206-Win64-VS17.zip"
          curl -fLo download/php.zip "https://downloads.php.net/~windows/releases/php-8.4.24-Win32-vs17-x64.zip"
          curl -fLo download/pma.zip "https://files.phpmyadmin.net/phpMyAdmin/5.2.3/phpMyAdmin-5.2.3-english.zip"
          curl -fLo download/mysql.zip "https://cdn.mysql.com//Downloads/MySQL-8.4/mysql-8.4.11-winx64.zip"

      - name: Resolve latest tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=$(gh release list --limit 1 --json tagName -q '.[0].tagName')
          if [ -z "$TAG" ]; then
            echo "::error::No existing release found to replace."
            exit 1
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Assemble staging
        shell: bash
        run: |
          set -eux
          STAGE="$GITHUB_WORKSPACE/stage"
          W="$STAGE/werd-${{ steps.tag.outputs.tag }}"
          mkdir -p "$W/bin" "$W/var/logs"

          unzip -q download/httpd.zip -d "$W/bin"
          unzip -q download/php.zip   -d "$W/bin/php-extract"
          unzip -q download/pma.zip   -d "$W/bin"
          unzip -q download/mysql.zip -d "$W/bin"

          if [ -d "$W/bin/Apache24" ]; then
            mkdir -p "$W/bin/httpd-2.4.66-251206-Win64-VS17"
            mv "$W/bin/Apache24" "$W/bin/httpd-2.4.66-251206-Win64-VS17/Apache24"
          fi

          mv "$W/bin/php-extract" "$W/bin/php-8.4.23-Win32-vs17-x64"

          cp -r config "$W/config"
          cp build/bin/werd.exe "$W/werd.exe"
          cp README.md "$W/"
          touch "$W/var/logs/.gitkeep"

      - name: Zip release
        shell: bash
        run: |
          cd stage
          zip -q -1 -r "$GITHUB_WORKSPACE/werd-windows-x64.zip" "werd-${{ steps.tag.outputs.tag }}"

      - name: Replace asset on latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=$(gh release list --limit 1 --json tagName -q '.[0].tagName')
          if [ -z "$TAG" ]; then
            echo "::error::No existing release found to replace."
            exit 1
          fi
          echo "Replacing assets on release: $TAG"
          gh release delete-asset "$TAG" werd-windows-x64.zip --yes || echo "no prior zip"
          gh release delete-asset "$TAG" werd.exe --yes || echo "no prior exe"
          gh release upload "$TAG" werd-windows-x64.zip --clobber
          gh release upload "$TAG" build/bin/werd.exe --clobber