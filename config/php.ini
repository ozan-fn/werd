[PHP]

; --- Development defaults (php.ini-development style) ---
display_errors = On
display_startup_errors = On
error_reporting = E_ALL
log_errors = On

memory_limit = 512M
max_execution_time = 120
max_input_time = 120
post_max_size = 128M
upload_max_filesize = 128M

date.timezone = Asia/Jakarta

; --- Extensions (MySQL, PostgreSQL, SQLite + Laravel/CI requirements) ---
; extension_dir relatif -> di-resolve terhadap lokasi php.exe (dynamic, portable)
extension_dir = "ext"
extension = curl
extension = exif
extension = fileinfo
extension = gd
extension = intl
extension = mbstring
extension = mysqli
extension = openssl
extension = pdo_mysql
extension = pdo_pgsql
extension = pdo_sqlite
extension = pgsql
extension = sqlite3
extension = zip

; --- OPcache (default settings) ---
[opcache]
zend_extension = "php_opcache.dll"
opcache.enable = 1
